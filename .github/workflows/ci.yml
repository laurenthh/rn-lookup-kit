name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit
      - name: Format
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Entry points load from dist
        run: >-
          node -e "for (const e of ['', '/travel', '/dining', '/food', '/exercise'])
          console.log('rn-lookup-kit' + e, Object.keys(require('rn-lookup-kit' + e)).length)"
      - name: Build as a consumer's install does (inside node_modules)
        run: |
          mkdir -p "$RUNNER_TEMP/app/node_modules"
          cp -R . "$RUNNER_TEMP/app/node_modules/rn-lookup-kit"
          cd "$RUNNER_TEMP/app/node_modules/rn-lookup-kit"
          rm -rf dist
          npm run build
          ls dist/places/airports.json dist/food/foods.json dist/exercise/exercises.json
      - name: Test
        run: bun run test
      - name: Test in other time zones
        run: bun run test:tz
